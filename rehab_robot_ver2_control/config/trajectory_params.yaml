velocity_config_node:
  ros__parameters:

    # List các chế độ
    control_mode: ["slow","normal","fast"]

    # ===== SLOW MODE =====
    slow_vel:   [0.25, 0.6, 0.3]       # v0, v1, v2
    slow_accel: [0.5, 1.0, 0.5]       # a0, a1, a2
    slow_decel: [0.5, 1.0, 0.5]       # d0, d1, d2

    # ===== NORMAL MODE =====
    normal_vel:   [0.5, 2.0, 0.6]
    normal_accel: [1.0, 3.0, 1.0]
    normal_decel: [1.0, 3.0, 1.0]

    # ===== FAST MODE =====
    fast_vel:   [1.0, 3.5, 1.25]
    fast_accel: [2.0, 5.0, 2.0]
    fast_decel: [2.0, 5.0, 2.0]
